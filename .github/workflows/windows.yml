name: Windows build and packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore AiUsageViewer.slnx --disable-parallel
      - run: dotnet build AiUsageViewer.slnx -c Release --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false
      - run: ./scripts/test.ps1
      - name: Obtain verified installer compiler
        run: |
          $compiler=Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $compiler
          if((Get-FileHash -LiteralPath $compiler -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') { throw 'Compiler checksum mismatch.' }
          $signature=Get-AuthenticodeSignature -LiteralPath $compiler
          if($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') { throw 'Compiler signature mismatch.' }
          $target=Join-Path $env:RUNNER_TEMP 'inno'
          $p=Start-Process $compiler -ArgumentList @('/PORTABLE=1','/VERYSILENT','/CURRENTUSER','/NOICONS','/NORESTART',('/DIR="'+$target+'"')) -WindowStyle Hidden -PassThru -Wait
          if($p.ExitCode -ne 0) { throw 'Compiler extraction failed.' }
      - name: Package
        run: ./scripts/package.ps1 -Iscc (Join-Path $env:RUNNER_TEMP 'inno\ISCC.exe')
      - name: Package MSIX for Microsoft Store
        run: ./scripts/package-msix.ps1
      - name: Smoke self-contained executable
        run: ./scripts/smoke.ps1 -Executable artifacts/publish/win-x64/AIUsageViewer.exe -Output artifacts/smoke -Suite
      - name: Package source
        run: ./scripts/package-source.ps1
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: windows-x64-preview
          path: |
            artifacts/release/*
            artifacts/msix/*.msix
            artifacts/msix/SHA256SUMS.txt
            artifacts/smoke/*.png
            artifacts/smoke/smoke-report.json
          if-no-files-found: error
